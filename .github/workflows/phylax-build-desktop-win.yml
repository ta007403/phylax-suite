# PHYLAX Blocks (fork): Windows desktop app of this fork, for trying it on a real PC.
# Same steps as the Windows job of build-desktop-apps.yml, without Trezor's signing and secrets.
name: "[PHYLAX] Build suite-desktop for Windows"

on:
  push:
    branches:
      - phylax
    paths-ignore:
      - "suite-native/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-desktop-win:
    name: Build suite-desktop-win
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      platform: win
    container:
      image: electronuserland/builder:22-wine
      options: --user 1001
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          lfs: true
          submodules: recursive

      - name: Install node and yarn
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install native binaries for every target architecture
        uses: ./.github/actions/yarn-target-architectures
        with:
          platform: ${{ env.platform }}

      - name: Install deps
        run: |
          yarn workspaces focus trezor-suite @suite/desktop-app @suite/desktop-app-renderer @suite/desktop-app-main @trezor/suite @suite/app-assets @trezor/transport-bridge @suite-common/message-system
          yarn message-system-sign-config

      - name: Build libs
        run: |
          yarn workspace @suite/app-assets build:lib
          yarn workspace @trezor/transport-bridge build:lib

      - name: Build Windows suite-desktop
        run: |
          yarn workspace @suite/desktop-app build:${{ env.platform }}
          mv suite/desktop-app/build-electron/* .

      - name: Upload the Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phylax-suite-desktop-win
          path: |
            Trezor-Suite*.exe
          retention-days: 14
