# PHYLAX Blocks (fork): Linux arm64 desktop app of this fork, for the PHYLAX wallet station
# (Raspberry Pi CM5). The phylax-station repo puts it into the station's eMMC image.
# Same steps as the Linux job of build-desktop-apps.yml (cross-built on x64, as Trezor does),
# arm64 only, without Trezor's signing and secrets.
name: "[PHYLAX] Build suite-desktop for Linux arm64"

on:
  push:
    branches:
      - phylax
    paths-ignore:
      - "suite-native/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-desktop-linux-arm64:
    name: Build suite-desktop-linux-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      platform: linux
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          lfs: true
          submodules: recursive

      - name: Install node and yarn
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install native binaries for every target architecture
        uses: ./.github/actions/yarn-target-architectures
        with:
          platform: ${{ env.platform }}

      - name: Install deps
        run: |
          yarn workspaces focus trezor-suite @suite/desktop-app @suite/desktop-app-renderer @suite/desktop-app-main @trezor/suite @suite/app-assets @trezor/transport-bridge @suite-common/message-system
          yarn message-system-sign-config

      - name: Build libs
        run: |
          yarn workspace @suite/app-assets build:lib
          yarn workspace @trezor/transport-bridge build:lib

      - name: Build Linux arm64 suite-desktop
        run: |
          yarn workspace @suite/desktop-app clean
          yarn workspace @suite/desktop-app build:ui
          yarn workspace @suite/desktop-app build:app
          yarn workspace @suite/desktop-app build:app:electron --publish never --linux --arm64
          mv suite/desktop-app/build-electron/*.AppImage .
          sha256sum PHYLAX-Suite*.AppImage | tee PHYLAX-Suite-linux-arm64.sha256

      - name: Upload the Linux arm64 AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phylax-suite-desktop-linux-arm64
          path: |
            PHYLAX-Suite*.AppImage
            PHYLAX-Suite-linux-arm64.sha256
          retention-days: 30
